name: Docs (Cloudflare Pages)

# Builds the Astro docs site and deploys it to Cloudflare Pages.
#   - Pushes to `main`  -> production deployment
#   - Pull requests      -> preview deployment + a sticky comment with the URL
#
# One-time setup (see docs/README.md):
#   1. Create a Cloudflare Pages project named `dotenv-run`
#      (Direct Upload / Wrangler, no build command needed on Cloudflare's side).
#   2. Add two repository secrets:
#         CLOUDFLARE_API_TOKEN   (Pages: Edit permission)
#         CLOUDFLARE_ACCOUNT_ID
#   Until those secrets exist the workflow no-ops instead of failing.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip PRs from forks — they cannot access the Cloudflare secrets.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are not set — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable docs previews."
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build docs
        if: steps.creds.outputs.ready == 'true'
        run: pnpm --filter @dotenv-run/docs build

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy docs/dist
            --project-name=dotenv-run
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          message: |
            ### 📚 Docs preview

            Your changes to the documentation site are deployed:

            | | |
            | --- | --- |
            | **Preview URL** | ${{ steps.deploy.outputs.deployment-url }} |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |

            _This comment updates automatically on every push to the PR._
